<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>RoomMuse 3D</title><style>
*{box-sizing:border-box}body{margin:0;background:#191720;color:#f8eef2;font:14px system-ui}#view{position:fixed;inset:0}canvas{width:100%;height:100%;touch-action:none}header{position:fixed;top:8px;left:12px;background:#211e2bdd;padding:10px 14px;border-radius:14px;font-weight:800}#panel{position:fixed;bottom:8px;left:8px;right:8px;max-height:43vh;overflow:auto;background:#211e2eee;border:1px solid #ffffff25;border-radius:18px;padding:12px}.tabs{display:flex;gap:6px;overflow:auto;margin-bottom:10px}button,select{background:#393343;color:#fff;border:0;border-radius:10px;padding:9px;font-weight:600}.active{background:#d88da6;color:#25161d}.tab{white-space:nowrap}.page{display:none}.page.on{display:block}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.ctl{background:#ffffff0b;padding:8px;border-radius:10px}.ctl label{display:flex;justify-content:space-between;color:#cbbdc7;font-size:12px}input{width:100%;accent-color:#d88da6}select{width:100%;margin-top:5px}.row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.hint{font-size:11px;color:#b9aeb8;margin-top:8px}@media(min-width:750px){#panel{left:auto;right:14px;bottom:14px;width:340px;max-height:80vh}}
</style></head><body><div id="view"></div><header>ROOMMUSE <span style="color:#d88da6">3D</span></header><div id="panel"><div class="tabs"><button class="tab active" data-page="body">Body</button><button class="tab" data-page="hair">Hair & face</button><button class="tab" data-page="outfit">Clothes</button><button class="tab" data-page="motion">Motion</button><button class="tab" data-page="room">Room</button></div>
<section class="page on" id="body"><div class="grid" id="sliders"></div><div class="row"><button id="reset">Reset body</button></div></section>
<section class="page" id="hair"><div class="grid"><div class="ctl">Hairstyle<select id="hair"><option>Long</option><option>Bob</option><option>Bun</option><option>Ponytail</option></select></div><div class="ctl">Hair color<select id="haircolor"><option value="#34201d">Espresso</option><option value="#17151b">Black</option><option value="#a66b42">Copper</option><option value="#d0a66d">Blonde</option></select></div><div class="ctl">Skin tone<select id="skin"><option value="#dca987">Warm</option><option value="#f0c5a6">Light</option><option value="#a96f50">Deep</option><option value="#c88c6c">Medium</option></select></div><div class="ctl">Eye color<select id="eyes"><option value="#4b3025">Brown</option><option value="#416c83">Blue</option><option value="#55724b">Green</option></select></div></div></section>
<section class="page" id="outfit"><div class="grid"><div class="ctl">Outfit<select id="clothes"><option value="set">Floral lounge set</option><option value="dress">Dress</option><option value="sport">Sport set</option><option value="casual">Casual</option></select></div><div class="ctl">Fabric color<select id="fabric"><option value="#f0dce0">Blush</option><option value="#8c9eb4">Blue</option><option value="#657c68">Sage</option><option value="#765b83">Violet</option></select></div></div></section>
<section class="page" id="motion"><div class="grid"><div class="ctl">Animation<select id="anim"><option value="idle">Idle</option><option value="dance">Dance</option><option value="walk">Walk</option><option value="wave">Wave</option></select></div><div class="ctl">Speed<input id="speed" type="range" min=".3" max="2" step=".1" value="1"></div></div><div class="row"><button id="pause">Pause</button></div></section>
<section class="page" id="room"><div class="ctl">Object<select id="object"><option value="pillow">Pillow</option><option value="lamp">Lamp</option><option value="plant">Plant</option></select></div><div class="row"><button data-m="x,-.15">←</button><button data-m="x,.15">→</button><button data-m="z,-.15">Forward</button><button data-m="z,.15">Back</button><button data-m="y,.1">Up</button><button data-m="y,-.1">Down</button><button data-m="s,.1">Bigger</button><button data-m="s,-.1">Smaller</button></div></section><p class="hint">Drag to orbit · Pinch or scroll to zoom. Prototype character and room are procedural 3D assets.</p></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#b9a69f');scene.fog=new THREE.Fog('#b9a69f',12,25);
const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,.1,100);let theta=.6,phi=1.2,dist=8;const target=new THREE.Vector3(0,1.7,0);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.outputColorSpace=THREE.SRGBColorSpace;document.querySelector('#view').appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffe8d7,0x625568,2));let light=new THREE.DirectionalLight(0xffdfbf,3);light.position.set(-3,7,5);light.castShadow=true;scene.add(light);
const M=c=>new THREE.MeshStandardMaterial({color:c,roughness:.8}), room=new THREE.Group();scene.add(room);
function cube(g,n,p,s,c){let m=new THREE.Mesh(new THREE.BoxGeometry(...s),M(c));m.name=n;m.position.set(...p);m.castShadow=true;m.receiveShadow=true;g.add(m);return m}
function ball(g,n,p,s,c){let m=new THREE.Mesh(new THREE.SphereGeometry(1,24,18),M(c));m.name=n;m.position.set(...p);m.scale.set(...s);m.castShadow=true;g.add(m);return m}
cube(room,'floor',[0,-.12,0],[12,.2,10],'#8b716a');cube(room,'wall',[0,2.7,-4.9],[12,5.5,.18],'#d8c8c1');cube(room,'side',[-5.9,2.7,0],[.18,5.5,10],'#c9b8b2');
let bed=new THREE.Group();bed.name='bed';room.add(bed);cube(bed,'base',[0,.28,-.5],[4.2,.48,3.4],'#8b6b60');cube(bed,'mattress',[0,.58,-.5],[4.35,.28,3.55],'#f0e9e6');cube(bed,'duvet',[0,.78,.1],[4.25,.18,2.8],'#e6dce0');let pillow=cube(bed,'pillow',[.95,.91,-1.65],[1.15,.22,.85],'#f4e8e5');
let lamp=new THREE.Group();lamp.name='lamp';lamp.position.set(-2.7,0,-2.5);room.add(lamp);let base=new THREE.Mesh(new THREE.CylinderGeometry(.28,.34,.12,20),M('#8d786d'));base.position.y=.95;lamp.add(base);let shade=new THREE.Mesh(new THREE.CylinderGeometry(.42,.28,.58,24,1,true),M('#f5d7a1'));shade.position.y=2.08;lamp.add(shade);let glow=new THREE.PointLight('#ffc77d',20,6);glow.position.y=2;lamp.add(glow);
let plant=new THREE.Group();plant.name='plant';plant.position.set(2.6,0,-2.8);room.add(plant);let pot=new THREE.Mesh(new THREE.CylinderGeometry(.25,.18,.42,16),M('#b77c62'));pot.position.y=.22;plant.add(pot);for(let i=0;i<6;i++){let l=ball(plant,'leaf',[Math.sin(i)*.25,.75+Math.cos(i)*.12,Math.cos(i)*.25],[.12,.35,.11],'#5d805e');l.rotation.z=(i-2)*.3}
cube(room,'bookshelf',[4.9,2.3,-4.45],[1.5,3.7,.42],'#69483d');for(let i=0;i<4;i++)cube(room,'book',[4.45+i*.23,3.45,-4.18],[.16,.55,.18],['#a85e58','#d2ae72','#758b8a','#7e668f'][i]);
const character=new THREE.Group();character.position.set(0,.8,1.1);scene.add(character);const rig=new THREE.Group();character.add(rig);const skin=M('#dca987'),hairMat=M('#34201d'),cloth=M('#f0dce0'),eyes=M('#4b3025');
function link(g,a,b,r1,r2,mat){let A=new THREE.Vector3(...a),B=new THREE.Vector3(...b),d=B.clone().sub(A),m=new THREE.Mesh(new THREE.CylinderGeometry(r2,r1,d.length(),16),mat);m.position.copy(A.add(B).multiplyScalar(.5));m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());g.add(m);return m}
const torso=new THREE.Group();torso.position.y=1.35;rig.add(torso);
const hips=ball(torso,'hips',[0,-.45,0],[.48,.42,.29],skin),waist=ball(torso,'waist',[0,-.02,0],[.37,.48,.26],skin),chest=ball(torso,'chest',[0,.48,0],[.53,.48,.31],skin);
ball(torso,'neck',[0,.91,0],[.16,.24,.16],skin);
const head=new THREE.Group();head.position.y=1.25;torso.add(head);ball(head,'face',[0,0,0],[.39,.49,.36],skin);ball(head,'eyeL',[-.15,.06,.31],[.055,.075,.035],eyes);ball(head,'eyeR',[.15,.06,.31],[.055,.075,.035],eyes);ball(head,'nose',[0,-.11,.34],[.065,.04,.045],M('#a96b68'));ball(head,'mouth',[0,-.25,.3],[.12,.035,.035],M('#a94f60'));
const hair=new THREE.Group();head.add(hair);function makeHair(style='Long'){hair.clear();ball(hair,'cap',[0,.24,-.02],[.42,.35,.39],hairMat);let n=style==='Bob'?7:style==='Bun'?5:9;for(let i=0;i<n;i++){let x=(i-(n-1)/2)*.09;if(style==='Bun'){ball(hair,'bun',[0,.48,-.18],[.24,.24,.24],hairMat);ball(hair,'strand',[x,-.08,-.15],[.07,.45,.12],hairMat)}else ball(hair,'strand',[x,style==='Bob'?-.12:-.18,-.14],[.075,style==='Bob'?.43:.72,.13],hairMat)}if(style==='Ponytail')ball(hair,'tail',[.3,-.38,-.2],[.11,.5,.12],hairMat)}
makeHair();
const arms=[];for(let side of [-1,1]){let g=new THREE.Group();g.position.set(side*.55,.68,0);torso.add(g);link(g,[0,0,0],[side*.05,-.48,.02],.13,.105,skin);link(g,[side*.05,-.48,.02],[side*.08,-.91,.08],.105,.075,skin);ball(g,'hand',[side*.08,-.98,.1],[.1,.13,.07],skin);arms.push(g)}
const legs=[];for(let side of [-1,1]){let g=new THREE.Group();g.position.set(side*.25,-.72,0);torso.add(g);link(g,[0,0,0],[0,-.68,.02],.19,.14,skin);link(g,[0,-.68,.02],[0,-1.34,.08],.13,.085,skin);ball(g,'foot',[0,-1.42,.2],[.12,.12,.25],skin);legs.push(g)}
let top=ball(torso,'top',[0,.42,0],[.54,.49,.32],cloth),bottom=ball(torso,'bottom',[0,-.48,.005],[.49,.37,.31],cloth);
const vals={height:1,chest:1,waist:1,hips:1,arms:1,legs:1};const defs=[['height','Height',.8,1.2],['chest','Chest width',.75,1.3],['waist','Waist width',.7,1.35],['hips','Hip width',.7,1.4],['arms','Arm thickness',.7,1.4],['legs','Leg thickness',.7,1.4]];
const sliderBox=document.querySelector('#sliders');defs.forEach(([id,label,min,max])=>{let d=document.createElement('div');d.className='ctl';d.innerHTML='<label>'+label+' <b id="'+id+'v">1.00</b></label><input type="range" min="'+min+'" max="'+max+'" step=".01" value="1">';let input=d.querySelector('input');input.oninput=()=>{vals[id]=+input.value;document.querySelector('#'+id+'v').textContent=vals[id].toFixed(2);apply()};sliderBox.append(d)});
function apply(){character.scale.y=vals.height;chest.scale.x=.53*vals.chest;waist.scale.x=.37*vals.waist;hips.scale.x=.48*vals.hips;arms.forEach(g=>g.scale.y=vals.arms);legs.forEach(g=>g.scale.x=vals.legs)}
document.querySelector('#reset').onclick=()=>{defs.forEach(([id])=>{vals[id]=1;let input=[...sliderBox.querySelectorAll('input')][defs.findIndex(d=>d[0]===id)];input.value=1;document.querySelector('#'+id+'v').textContent='1.00'});apply()};
document.querySelector('#hair').onchange=e=>makeHair(e.target.value);document.querySelector('#haircolor').onchange=e=>hairMat.color.set(e.target.value);document.querySelector('#skin').onchange=e=>skin.color.set(e.target.value);document.querySelector('#eyes').onchange=e=>eyes.color.set(e.target.value);
function outfit(){cloth.color.set(document.querySelector('#fabric').value);let v=document.querySelector('#clothes').value;bottom.visible=v!=='dress';top.scale.set(v==='dress'?.58:.54,v==='sport'?.42:.49,.33)}document.querySelector('#fabric').onchange=outfit;document.querySelector('#clothes').onchange=outfit;
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.page').forEach(x=>x.classList.toggle('on',x.id===b.dataset.page))});
let animation='idle',playing=true,speed=1;document.querySelector('#anim').onchange=e=>{animation=e.target.value;torso.rotation.set(0,0,0);arms.forEach(a=>a.rotation.set(0,0,0));legs.forEach(a=>a.rotation.set(0,0,0))};document.querySelector('#speed').oninput=e=>speed=+e.target.value;document.querySelector('#pause').onclick=e=>{playing=!playing;e.target.textContent=playing?'Pause':'Play'};
const objects={pillow,lamp,plant};document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{let [a,v]=b.dataset.m.split(','),o=objects[document.querySelector('#object').value];if(a==='s')o.scale.multiplyScalar(1+ +v);else o.position[a]+= +v});
function updateCam(){phi=Math.max(.35,Math.min(1.5,phi));camera.position.set(target.x+dist*Math.sin(phi)*Math.sin(theta),target.y+dist*Math.cos(phi),target.z+dist*Math.sin(phi)*Math.cos(theta));camera.lookAt(target)}updateCam();
let down=false,px=0,py=0;renderer.domElement.onpointerdown=e=>{down=true;px=e.clientX;py=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)};renderer.domElement.onpointermove=e=>{if(!down)return;theta-=(e.clientX-px)*.008;phi+=(e.clientY-py)*.006;px=e.clientX;py=e.clientY;updateCam()};renderer.domElement.onpointerup=()=>down=false;renderer.domElement.addEventListener('wheel',e=>{dist=Math.max(4.5,Math.min(13,dist+e.deltaY*.008));updateCam()},{passive:true});
let t0=0;function loop(){requestAnimationFrame(loop);let t=performance.now()/1000*speed;if(playing){if(animation==='idle'){torso.position.y=1.35+Math.sin(t*2)*.02}if(animation==='dance'){torso.rotation.z=Math.sin(t*4)*.12;arms[0].rotation.z=.5+Math.sin(t*4)*.4;arms[1].rotation.z=-.5-Math.sin(t*4+1)*.4;legs[0].rotation.x=Math.sin(t*4)*.25;legs[1].rotation.x=-Math.sin(t*4)*.25}if(animation==='walk'){legs[0].rotation.x=Math.sin(t*5)*.4;legs[1].rotation.x=-Math.sin(t*5)*.4;arms[0].rotation.x=-Math.sin(t*5)*.25;arms[1].rotation.x=Math.sin(t*5)*.25}if(animation==='wave'){arms[1].rotation.z=-1.3+Math.sin(t*6)*.2}}renderer.render(scene,camera)}loop();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
