name: Build RoomMuse 3D APK
on:
  workflow_dispatch:
  push:
    branches: [ roommuse3d-android ]
    paths:
      - 'RoomMuse3D_Android/**'
      - '.github/workflows/roommuse3d-android.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept Android SDK licenses and install SDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle -p RoomMuse3D_Android assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: RoomMuse3D-debug-apk
          path: RoomMuse3D_Android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
