name: Build RoomMuse 3D APK
on:
  workflow_dispatch:
  push:
    branches: [ roommuse3d-android ]
    paths:
      - 'RoomMuse3D_Android/**'
      - '.github/workflows/roommuse3d-android.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false
          packages: ''
      - name: Accept licenses and install SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle -p RoomMuse3D_Android assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: RoomMuse3D-debug-apk
          path: RoomMuse3D_Android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
